<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quick-form-h5 — 界面预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f0f2f5; font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
  .page-title { text-align: center; padding: 28px 0 8px; color: #333; font-size: 20px; font-weight: 600; }
  .page-sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
  .tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
  .tabs button {
    padding: 8px 18px; border: 1px solid #d9d9d9; background: #fff; border-radius: 18px;
    font-size: 14px; color: #666; cursor: pointer; transition: all .2s;
  }
  .tabs button.active { background: #108ee9; border-color: #108ee9; color: #fff; }
  .stage { display: flex; justify-content: center; }
  .phone {
    width: 375px; height: 720px; background: #fff; border-radius: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12); overflow: hidden; position: relative;
  }
  .screen { display: none; height: 100%; overflow: hidden; }
  .screen.active { display: block; }

  /* ---- shared ---- */
  .btn {
    width: 240px; height: 56px; border-radius: 16px; text-align: center; font-size: 16px;
    line-height: 56px; font-weight: 500; cursor: pointer; border: 2px solid transparent;
    transition: all .3s; margin: 12px auto; color: rgba(0,0,0,.65); background: #fff; border-color: #d9d9d9;
  }
  .btn-primary { background: #108ee9; border-color: #108ee9; color: #fff; }
  .btn-dashed { border-style: dashed; }
  .field { margin: 0 20px 16px; }
  .field .label { display: flex; font-size: 14px; color: #363636; font-weight: 600; line-height: 32px; }
  .field .label .req { color: #ff3860; margin-right: 4px; }
  .field .input {
    width: 100%; height: 44px; border: 1px solid #dbdbdb; border-radius: 6px; font-size: 14px;
    padding: 0 12px; background: #fff; color: #363636;
  }
  .radio-row { display: flex; gap: 20px; padding: 6px 0; font-size: 14px; color: #363636; }
  .radio-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .dot { width: 16px; height: 16px; border: 1px solid #ccc; border-radius: 50%; position: relative; }
  .radio-row input:checked + .dot { background: #108ee9; border-color: #108ee9; }
  .radio-row input:checked + .dot::after { content: ""; position: absolute; inset: 4px; background: #fff; border-radius: 50%; }
  .radio-row input { display: none; }

  /* ---- screen 1: entry ---- */
  .s1 { padding-top: 80px; text-align: center; }
  .s1 h2 { font-size: 32px; color: #108ee9; margin-bottom: 10px; }
  .s1 p.sub { font-size: 15px; color: #666; margin-bottom: 60px; }
  .s1 .tip { font-size: 12px; color: #888; margin-top: 30px; }
  .s1 .tip a { color: #108ee9; }

  /* ---- screen 2: form ---- */
  .s2 { padding-top: 28px; }
  .s2 .top { text-align: center; font-size: 20px; color: #108ee9; margin-bottom: 24px; }

  /* ---- screen 3: detail ---- */
  .s3 { padding: 24px 20px; }
  .s3 .card { background: #f7f7f7; border: 1px solid #ddd; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .s3 .card .tag { color: #108ee9; font-weight: 600; font-size: 15px; margin-bottom: 12px; }
  .s3 .card .img { width: 120px; height: 150px; background: #d9d9d9; border-radius: 6px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 13px; }
  .s3 .card textarea { width: 100%; height: 90px; border: none; background: transparent; font-size: 14px; line-height: 22px; resize: none; color: #363636; }
  .s3 .share-title { text-align: center; font-weight: 600; color: #363636; margin: 22px 0 10px; }
  .s3 .icons { display: flex; }
  .s3 .icons .ic { flex: 1; text-align: center; }
  .s3 .icons .ic .circle { width: 44px; height: 44px; border-radius: 50%; background: #108ee9; color: #fff; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .s3 .icons .ic p { font-size: 12px; color: #363636; }
</style>
</head>
<body>
  <div class="page-title">quick-form-h5 界面预览</div>
  <div class="page-sub">快速表单 H5 模板 — 入口 / 发布表单 / 详情页</div>

  <div class="tabs">
    <button class="active" data-s="s1">入口页</button>
    <button data-s="s2">发布表单</button>
    <button data-s="s3">详情页</button>
  </div>

  <div class="stage">
    <div class="phone">
      <!-- 入口页 -->
      <div class="screen s1 active">
        <h2>Quick Form H5</h2>
        <p class="sub">一个支持突发事件的移动端快速表单模板</p>
        <div class="btn btn-primary">快速上手</div>
        <div class="btn btn-dashed">项目源码</div>
        <div class="tip">点击"快速上手"代表同意 <a href="#">《Quick Form H5 使用说明》</a></div>
      </div>

      <!-- 发布表单 -->
      <div class="screen s2">
        <div class="top">发布寻人</div>
        <div class="field">
          <div class="label"><span class="req">*</span><span>姓名：</span></div>
          <input class="input" placeholder="姓名" value="张小满">
        </div>
        <div class="field">
          <div class="label"><span class="req">*</span><span>性别：</span></div>
          <div class="radio-row">
            <label><input type="radio" name="sex" checked><span class="dot"></span>男</label>
            <label><input type="radio" name="sex"><span class="dot"></span>女</label>
          </div>
        </div>
        <div class="field">
          <div class="label"><span>年龄：</span></div>
          <input class="input" placeholder="年龄" value="8">
        </div>
        <div class="btn btn-primary" style="width:200px;height:48px;line-height:48px;margin-top:24px;">发布</div>
      </div>

      <!-- 详情页 -->
      <div class="screen s3">
        <div class="card">
          <div class="tag">寻人启事</div>
          <div class="img">照片</div>
          <textarea disabled>张小满，男，8岁，在本次事件中失去联系，有知情者请联系：张建国（电话:138****0000）。望转发，万分感谢！</textarea>
          <div class="btn btn-primary" style="width:200px;height:48px;line-height:48px;">我也要发布寻人</div>
        </div>
        <div class="share-title">帮他转发</div>
        <div class="icons">
          <div class="ic"><div class="circle">Q</div><p>QQ好友</p></div>
          <div class="ic"><div class="circle">微</div><p>微信好友</p></div>
          <div class="ic"><div class="circle">S</div><p>浏览器</p></div>
        </div>
      </div>
    </div>
  </div>

<script>
  document.querySelectorAll('.tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelector('.' + btn.dataset.s).classList.add('active');
    });
  });

  // Optional: open on a specific screen via ?tab=s1|s2|s3 (used for previews).
  (function () {
    var target = new URLSearchParams(location.search).get('tab');
    if (target) {
      document.querySelectorAll('.tabs button').forEach(function (b) {
        b.classList.toggle('active', b.dataset.s === target);
      });
      document.querySelectorAll('.screen').forEach(function (s) {
        s.classList.toggle('active', s.classList.contains(target));
      });
    }
  })();
</script>
</body>
</html>
