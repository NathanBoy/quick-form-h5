<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A mobile-first rapid form H5 template built with Vue 2 &amp; Vite.">
  <meta content="telephone=no" name="format-detection">
  <title>Quick Form H5</title>
  <script>
    // Mobile rem adaptation: 1rem = 20px on a 320px design width.
    (function () {
      var doc = document;
      var designWidth = 320;
      function resize() {
        var width = doc.documentElement.getBoundingClientRect().width || window.innerWidth;
        if (width > 640) width = 640;
        doc.documentElement.style.fontSize = (20 * width / designWidth) + 'px';
      }
      resize();
      window.addEventListener('resize', function () {
        clearTimeout(this._tid);
        this._tid = setTimeout(resize, 33);
      }, false);
      window.addEventListener('load', resize, false);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
